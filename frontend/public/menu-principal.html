<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Registro Estatal de Pesca y Acuacultura del Gobierno del Estado de Nayarit." />
    <title>SIREPES | Tipo de registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Tailwind Play CDN: práctico para probar este archivo; para producción usa el build Tailwind del proyecto. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        --color-menu-burgundy: #701432;
        --color-menu-burgundy-dark: #561027;
        --color-menu-navy: #0b1f4b;
        --color-sirepes-gold: #e8c46d;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body class="m-0 min-h-screen w-full overflow-x-hidden bg-white font-sans text-menu-navy">
    <a href="#contenido-principal" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-3 focus:font-semibold focus:text-menu-navy focus:shadow-lg">Saltar al contenido principal</a>

    <header class="relative z-20 flex min-h-[88px] items-center bg-white px-5 shadow-sm sm:min-h-[96px] sm:px-8 lg:px-12">
      <!-- Cambia el archivo de logo aquí si recibes otra versión oficial. -->
      <img src="./media/sirepes/seder-nayarit.png" alt="Secretaría de Desarrollo Rural del Gobierno de Nayarit" width="1420" height="300" class="h-auto w-[260px] max-w-[82vw] object-contain sm:w-[320px]" />
    </header>

    <main id="contenido-principal" class="relative isolate min-h-[calc(100svh-88px)] w-full overflow-hidden pb-8 sm:min-h-[calc(100svh-96px)]">
      <div aria-hidden="true" class="absolute inset-x-0 top-0 -z-20 h-[530px] sm:h-[610px] lg:h-[660px]">
        <!-- Sustituye estas rutas para cambiar la foto. Las tres variantes cargan según el tamaño de pantalla. -->
        <picture>
          <source media="(min-width: 1400px)" srcset="./media/sirepes/hero-ocean-2172.webp 2172w, ./media/sirepes/hero-ocean-1600.webp 1600w" sizes="100vw" />
          <source media="(min-width: 700px)" srcset="./media/sirepes/hero-ocean-1600.webp 1600w, ./media/sirepes/hero-ocean-1024.webp 1024w" sizes="100vw" />
          <img src="./media/sirepes/hero-ocean-1024.webp" srcset="./media/sirepes/hero-ocean-1024.webp 1024w, ./media/sirepes/hero-ocean-1600.webp 1600w, ./media/sirepes/hero-ocean-2172.webp 2172w" sizes="100vw" alt="" fetchpriority="high" width="2172" height="724" class="h-full w-full object-cover object-[24%_center] sm:object-center" />
        </picture>
        <div class="absolute inset-0 bg-gradient-to-b from-white/60 via-white/25 to-white/5"></div>
      </div>

      <section class="relative z-10 mx-auto px-5 pt-12 text-center sm:px-8 sm:pt-14 lg:pt-16">
        <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-menu-burgundy sm:text-sm">SIREPES · Nayarit</p>
        <!-- Cambia el título aquí si cambia el nombre oficial del sistema. -->
        <h1 class="mx-auto max-w-5xl text-balance text-[clamp(1.65rem,4vw,3rem)] font-extrabold uppercase leading-[1.12] tracking-tight text-menu-navy drop-shadow-[0_1px_0_rgba(255,255,255,0.55)]">REGISTRO ESTATAL DE PESCA Y ACUACULTURA</h1>
        <p class="mt-4 text-base font-medium text-[#163c66] sm:text-xl">Selecciona el tipo de registro que deseas realizar</p>
      </section>

      <!-- Franjas decorativas de olas; se dibujan detrás de los enlaces. -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-[205px] -z-10 h-[210px] sm:top-[250px] sm:h-[240px] lg:top-[300px]">
        <svg class="h-full w-full" viewBox="0 0 1440 240" preserveAspectRatio="none">
          <path d="M0 58C190 165 325 160 520 102s354-73 540 2 260 87 380 17v119H0z" fill="#1684a0" />
          <path d="M0 82c190 100 325 98 520 42s354-58 540 15 260 69 380 3v98H0z" fill="#31b7d1" />
          <path d="M0 105c190 82 325 81 520 29s354-45 540 19 260 55 380 2v87H0z" fill="#a6e7f2" />
        </svg>
      </div>

      <nav aria-label="Selecciona un tipo de registro" class="relative z-10 mx-auto mt-12 grid w-full max-w-5xl grid-cols-1 gap-5 px-5 sm:mt-14 sm:gap-6 sm:px-8 lg:grid-cols-2 lg:gap-8 lg:mt-16">
        <!-- Cambia href="#seccion-pesca" por la ruta definitiva del formulario de Pesca. -->
        <a href="#seccion-pesca" class="group flex min-h-[112px] w-full items-center justify-center rounded-xl border border-t-white/50 border-b-[7px] border-b-[#3d071b] bg-menu-burgundy px-5 py-6 text-center text-2xl font-extrabold tracking-[0.06em] text-white shadow-[0_14px_26px_rgba(26,21,38,0.24)] transition duration-200 hover:-translate-y-1 hover:bg-menu-burgundy-dark hover:shadow-[0_18px_32px_rgba(26,21,38,0.3)] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-menu-navy focus-visible:ring-offset-4 active:translate-y-0 active:border-b-[3px] active:shadow-md motion-reduce:transition-none sm:min-h-[144px] sm:text-[28px]">PESCA</a>
        <!-- Cambia href="#seccion-acuacultura" por la ruta definitiva del formulario de Acuacultura. -->
        <a href="#seccion-acuacultura" class="group flex min-h-[112px] w-full items-center justify-center rounded-xl border border-t-white/50 border-b-[7px] border-b-[#3d071b] bg-menu-burgundy px-5 py-6 text-center text-2xl font-extrabold tracking-[0.06em] text-white shadow-[0_14px_26px_rgba(26,21,38,0.24)] transition duration-200 hover:-translate-y-1 hover:bg-menu-burgundy-dark hover:shadow-[0_18px_32px_rgba(26,21,38,0.3)] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-menu-navy focus-visible:ring-offset-4 active:translate-y-0 active:border-b-[3px] active:shadow-md motion-reduce:transition-none sm:min-h-[144px] sm:text-[28px]">ACUACULTURA</a>
      </nav>

    </main>
  </body>
</html>
