# Clave única y metadatos del proyecto
sonar.projectKey=SIREPES
sonar.projectName=SIREPES - Sistema de Registro Estatal de Pesca y Acuacultura
sonar.projectVersion=0.1.0

# Carpetas con código fuente a analizar
sonar.sources=api/src,frontend/src

# Exclusiones para ignorar librerías, temporales y compilados
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/tmp/**,**/tmp_analysis/**,**/.vscode/**,**/.agents/**,**/coverage/**

# Codificación de caracteres
sonar.sourceEncoding=UTF-8

# Servidor SonarQube local por defecto
sonar.host.url=http://localhost:9000
